name: Contributing check
description: Validate branch name, commit messages, and PR title against the conventions defined in CONTRIBUTING.md.

runs:
  using: composite
  steps:
    # Dependabot PRs deviate from the branch-name and PR-title conventions (e.g.
    # `dependabot/github_actions/...` branches), so every step below is gated to
    # skip them. Keying on the PR author (not github.actor) survives synchronize
    # events and is not spoofable — only GitHub can author under `dependabot[bot]`.
    # Gating each step (not the job) keeps the required "Validate PR" check GREEN.
    # Every step MUST carry this identical guard; a new step without it re-blocks
    # dependabot. Actions do not support YAML anchors, so it is repeated verbatim.
    - name: Validate branch name
      if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      uses: deepakputhraya/action-branch-name@v1.0.0
      with:
        regex: '^(issue-\d+-[a-z0-9]+(-[a-z0-9]+)*|[a-z][a-z0-9]*-\d+-[a-z0-9]+(-[a-z0-9]+)*|(hotfix|trivial|maintenance|proposal|security)-[a-z0-9]+(-[a-z0-9]+)*|release-([a-z0-9]+(-[a-z0-9]+)*-)?\d+\.\d+\.\d+)$'
        min_length: 5
        max_length: 100
        ignore: main,master

    - name: Checkout
      if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # CONTRIBUTING.md forbids merging the base branch into a pull-request
    # branch. Two choices keep this from over-firing: the range starts at the
    # merge base, so merges inherited from base history are outside it, and a
    # merge only counts when one of its extra parents is already contained in
    # the base branch, so a PR that merges a second topic branch still passes.
    # HEAD is deliberately unused — on `pull_request` actions/checkout resolves
    # refs/pull/N/merge, so HEAD is itself a merge commit and would self-match.
    - name: Validate no base-branch merges
      if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        git fetch --no-tags --quiet origin "${BASE_REF}"
        base_sha="$(git merge-base FETCH_HEAD "${HEAD_SHA}")"
        offenders=()
        while read -r merge_sha; do
          [ -n "${merge_sha}" ] || continue
          while read -r parent; do
            [ -n "${parent}" ] || continue
            if git merge-base --is-ancestor "${parent}" FETCH_HEAD; then
              offenders+=("${merge_sha}")
              break
            fi
          done < <(git rev-list --parents -n 1 "${merge_sha}" | cut -d' ' -f3- | tr ' ' '\n')
        done < <(git rev-list --merges "${base_sha}..${HEAD_SHA}")
        if [ "${#offenders[@]}" -gt 0 ]; then
          echo "::error::Pull request merges the base branch into its head branch. Rebase onto ${BASE_REF} and push with --force-with-lease. See CONTRIBUTING.md §updating-pull-request-branches."
          git log --no-walk --format='  %h %s' "${offenders[@]}"
          exit 1
        fi
        echo "contributing-check: no base-branch merges since ${base_sha}"

    - name: Validate commit messages
      if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      uses: wagoid/commitlint-github-action@v6
      with:
        configFile: ./commitlint.config.ts
        failOnWarnings: false

    - name: Validate PR title (semantic)
      if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      uses: amannn/action-semantic-pull-request@v6
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        types: |
          HOTFIX
          TRIVIAL
          MAINTENANCE
          PROPOSAL
          SECURITY
          Release
          [A-Z][A-Z0-9]*-\d+
          [A-Z]\w*
        headerPattern: '^([A-Z]\S*?):?\s+(.+)$'
        headerPatternCorrespondence: type, subject
        subjectPattern: '.*[^.]$'
        subjectPatternError: |
          PR title must not end with a period. See CONTRIBUTING.md §pr-title.

    - name: Validate PR title length
      if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        if [ ${#PR_TITLE} -gt 120 ]; then
          echo "::error::PR title exceeds 120 character limit (${#PR_TITLE} chars). See CONTRIBUTING.md §pr-title."
          exit 1
        fi
